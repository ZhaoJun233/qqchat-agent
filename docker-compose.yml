# ══════════════════════════════════════════════════════════════
#  QQ Chat Agent（Headless）+ NapCat 全容器部署
#
#  用法：
#    cp .env.example .env      # 填写 API Key / 白名单 / QQ 号
#    docker compose up -d
#    docker compose logs -f napcat      # 首次登录看二维码
#
#  首次登录（一次性）：
#    1) docker compose logs napcat   →  用手机 QQ 扫日志里的二维码
#    2) 浏览器打开 http://<主机IP>:6099 →  WebUI 里开启「正向 WS」
#       端口 3001，Token 与 .env 的 ONEBOT_TOKEN 一致
#    3) docker compose restart qqchat   →  readyz 变 200
#
#  或者用反向 WS（不用登 WebUI 开端口，见文件底部的说明）
# ══════════════════════════════════════════════════════════════

services:
  # ─────────── QQ 协议端（Linux QQ + NapCat） ───────────
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: qqchat-napcat
    restart: unless-stopped
    environment:
      # 容器内 Linux QQ 的运行用户，需与挂载目录属主一致
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
      # 快速登录：带上 QQ 号后，重启容器会复用 ./napcat/ntqq 里的登录态，无需重新扫码。
      # ⚠ 这两行（TZ / ACCOUNT）很容易在“把仓库版 compose 覆盖到部署目录”时被弄丢，
      #   丢了之后 ACCOUNT 为空 → NapCat 只能出二维码 → 需要人工重新扫码。
      - ACCOUNT=${BOT_UIN:-}
    ports:
      # OneBot 正向 WS：机器人（qqchat 容器）通过内部网络访问，无需对宿主机暴露
      - "127.0.0.1:3001:3001"
      # WebUI 管理面板：仅本机可访问。要用手机/外网扫码请改成 "6099:6099"
      - "127.0.0.1:6099:6099"
    volumes:
      - ./napcat/config:/app/napcat/config          # NapCat / OneBot 配置
      - ./napcat/ntqq:/app/.config/QQ               # 登录态（重启免扫码）
    networks:
      - qqchat

  # ─────────── AI 机器人 ───────────
  qqchat:
    build:
      context: .
      dockerfile: src/QQChatAgent.Headless/Dockerfile
    image: qqchat-agent:latest
    container_name: qqchat-bot
    restart: unless-stopped
    depends_on:
      - napcat
    environment:
      # ---- 模型（OpenAI 兼容：DeepSeek / OpenAI / 通义 / 本地 Ollama 等）----
      QQCHAT_BASE_URL: ${MODEL_BASE_URL:-https://api.openai.com/v1}
      QQCHAT_API_KEY: ${MODEL_API_KEY:?请在 .env 里填 MODEL_API_KEY}
      QQCHAT_MODEL: ${MODEL_NAME:-gpt-4o-mini}
      QQCHAT_MAX_TOKENS: ${MAX_TOKENS:-2048}

      # ---- QQ 通道：正向 WS 连到 napcat 容器 ----
      QQCHAT_ONEBOT_PROTOCOL: ForwardWebSocket
      QQCHAT_ONEBOT_URL: ws://napcat:3001
      QQCHAT_ONEBOT_TOKEN: ${ONEBOT_TOKEN:-}

      # ---- 机器人身份与行为 ----
      QQCHAT_UIN: ${BOT_UIN:-}
      QQCHAT_WHITELIST: ${WHITELIST:?请在 .env 里填 WHITELIST（* 表示全部，空值=忽略所有消息）}
      QQCHAT_PERSONA: ${BOT_PERSONA:-}
      QQCHAT_AI_DESIRE: ${AI_DESIRE:-50}
      QQCHAT_AI_MODE: ${AI_MODE:-1}

      # ---- 回复节奏 ----
      QQCHAT_GROUP_COOLDOWN: ${GROUP_COOLDOWN:-8}
      QQCHAT_PRIVATE_COOLDOWN: ${PRIVATE_COOLDOWN:-3}
      QQCHAT_IDLE_FALLBACK: ${IDLE_FALLBACK:-60}
      QQCHAT_SPLIT_REPLIES: ${SPLIT_REPLIES:-1}
      QQCHAT_SEGMENT_DELAY_MS: ${SEGMENT_DELAY_MS:-700}

      # ---- 运维 ----
      QQCHAT_HEALTH_PORT: 8080
      QQCHAT_HEALTH_BIND: "+"
      # 面板访问令牌（可选）。设了之后访问面板要带 ?token=xxx（会自动记住）；
      # /healthz 与 /readyz 不受影响，容器健康检查照常工作。
      # 注意：这类变量必须写在本文件的 environment 里才会进容器 ——
      # .env 只用于 compose 的 ${VAR} 变量替换，不会自动传给容器。
      QQCHAT_PANEL_TOKEN: ${PANEL_TOKEN:-}
      # 面板内扫码登录：机器人向 NapCat WebUI 取登录二维码（用户可以不出面板就扫码）
      # 令牌值见 napcat/config/webui.json 的 token 字段；不配也不影响消息通道，
      # 只是面板里那个「扫码登录」卡片会提示未配置。
      QQCHAT_NAPCAT_WEBUI_URL: ${NAPCAT_WEBUI_URL:-http://napcat:6099}
      QQCHAT_NAPCAT_WEBUI_TOKEN: ${NAPCAT_WEBUI_TOKEN:-}

      # ---- 表情包（全库共用一份；行为类配置以 settings.json 为准，这里只当种子）----
      QQCHAT_STICKERS: ${STICKERS:-1}
      QQCHAT_STICKER_MAX: ${STICKER_MAX:-120}
      QQCHAT_STICKER_CANDIDATES: ${STICKER_CANDIDATES:-6}
      QQCHAT_STICKER_CURATE_INTERVAL: ${STICKER_CURATE_INTERVAL:-3600}
      QQCHAT_STICKER_COOLDOWN: ${STICKER_COOLDOWN:-120}
      QQCHAT_ENABLE_POKE: ${ENABLE_POKE:-1}
      QQCHAT_POKE_COOLDOWN: ${POKE_COOLDOWN:-45}
      QQCHAT_MOOD_TTL: ${MOOD_TTL:-7200}
      # 图片下载的 SSRF 防护默认开；只有“自建 NapCat 回内网地址”时才设 1
      QQCHAT_ALLOW_PRIVATE_IMAGE_HOSTS: ${ALLOW_PRIVATE_IMAGE_HOSTS:-0}
      # ---- 语音消息（TTS）----
      # 下面这几项都属“行为配置”：只在**首次部署**（还没有 settings.json 时）当种子，
      # 之后 settings.json 是唯一所有者，改这里不会再生效 —— 要调请用面板「语音消息」卡片。
      QQCHAT_ENABLE_VOICE: ${ENABLE_VOICE:-0}
      QQCHAT_VOICE: ${TTS_VOICE:-zh_CN-huayan-medium}
      QQCHAT_VOICE_SPEED: ${VOICE_SPEED:-100}
      QQCHAT_VOICE_MAX_CHARS: ${VOICE_MAX_CHARS:-80}
      QQCHAT_TTS_URL: ${TTS_URL:-http://tts:5000}
      # ---- 联网搜索 ----
      # 同样是行为配置：只在首次部署当种子；之后请用面板「联网搜索」卡片调。
      QQCHAT_WEB_SEARCH: ${WEB_SEARCH:-1}
      QQCHAT_SEARCH_USE_MODEL: ${SEARCH_USE_MODEL:-1}
      QQCHAT_SEARCH_SOURCES: ${SEARCH_SOURCES:-wiki|https://zh.wikipedia.org/w/api.php?action=query&list=search&srsearch={q}&format=json&srlimit=5&utf8=1}
      QQCHAT_SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS:-5}
      QQCHAT_SEARCH_TIMEOUT: ${SEARCH_TIMEOUT:-20}
      QQCHAT_SEARCH_READ_CHARS: ${SEARCH_READ_CHARS:-1800}
      QQCHAT_VERBOSE: ${VERBOSE:-1}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/data                                # 设置 / 会话 / 人物档案 / 日志
    ports:
      # 健康检查 / 状态，仅本机可访问（容器内 HEALTHCHECK 不受影响）
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "dotnet", "/app/QQChatAgent.Headless.dll", "--health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - qqchat

  # ─────────── 语音合成（Piper 旁路服务） ───────────
  # 为什么单独开一个容器，而不是把 Piper 塞进机器人镜像：
  #   • Piper 是 python + onnxruntime（镜像约 490MB），塞进去机器人镜像直接翻几倍；
  #   • 语音是“偶尔用”的能力 —— 它挂了也只能影响语音（机器人会降级成发文字），不能拖垮对话。
  # 镜像怎么来（一次性）：python:3.11-slim + pip install piper-tts → 见 tools/tts.Dockerfile
  #    docker build -t piper-tts:latest -f tools/tts.Dockerfile tools/
  # 音色模型（*.onnx）放 ./tts/（首次用 tools/tts-server.py 里的说明下载，约 63MB）。
  # pinyin 类音色（zh_CN-xiao_ya-medium）还要 ./tts/g2pW/（多音字消歧数据，约 150MB）：
  #   见 tools/tts.Dockerfile 顶部的下载命令 —— 目录名必须是 g2pW，
  #   而且容器工作目录得是 /data（就是下面这行 working_dir，别删）。
  # 机器人**不**搬运音频：它只把 http://tts:5000/speak?text=… 这个 URL 交给 NapCat，
  # 由协议端自己下载并转 silk —— 所以 tts 必须和 napcat 在同一个网络里。
  tts:
    image: piper-tts:latest
    container_name: qqchat-tts
    restart: unless-stopped
    # 底镜像的 ENTRYPOINT 是 `python -m piper`（Piper 自己的 CLI），
    # 这里把它换成 python，再跑我们的 HTTP 旁路脚本 —— 少了 entrypoint 这行就会一直
    # 以 piper CLI 启动并报 “the following arguments are required: -m/--model” 而重启循环。
    entrypoint: ["python"]
    command: ["/app/tts-server.py"]
    # 工作目录必须是 /data：piper 找中文多音字表用的是“当前目录/g2pW”
    # （PiperVoice.download_dir 默认 Path.cwd()），不设的话它会去 /g2pW 找个空。
    working_dir: /data
    environment:
      - VOICE_DIR=/data
      - DEFAULT_VOICE=${TTS_VOICE:-zh_CN-huayan-medium}
      - PORT=5000
      - TZ=${TZ:-Asia/Shanghai}
      # pinyin 类音色要的 BERT 分词器缓存（约 1MB，落在 /data/hf，重建容器不用重下）
      - HF_HOME=/data/hf
    volumes:
      - ./tts:/data                                  # 音色模型 + 旁路脚本
      - ./tts/tts-server.py:/app/tts-server.py:ro     # 旁路服务脚本（由 deploy-qqchat.py 同步）
    # 只给宿主机的自测入口（机器人走内部网络，不需要这个）
    ports:
      - "127.0.0.1:5010:5000"
    networks:
      - qqchat

networks:
  qqchat:
    driver: bridge

# ══════════════════════════════════════════════════════════════
#  备选：反向 WebSocket（机器人监听 3001，NapCat 主动连入）
#  优点：不必在 NapCat WebUI 里开正向 WS；改配置后两边都能重连。
#
#  1) 把 qqchat 服务的这两行改掉：
#       QQCHAT_ONEBOT_PROTOCOL: ReverseWebSocket
#       QQCHAT_ONEBOT_URL: http://0.0.0.0:3001
#     并给它加端口暴露：
#       ports:
#         - "3001:3001"
#  2) 在 NapCat WebUI（http://<主机IP>:6099）→ 网络配置 → 添加「反向 WebSocket」
#     URL 填 ws://qqchat:3001，Token 与 ONEBOT_TOKEN 一致
#
#  ⚠️ Docker 版 NapCat 的限制：收不到语音与文件消息（纯文字/图片正常）。
# ══════════════════════════════════════════════════════════════
